name: Build man pages

on:
  workflow_dispatch:
  push:
    paths:
      - docs/**
    branches:
      - 'main'

jobs:
  main:
    name: Build man pages
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LOCAL_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
    - name: Install deps
      run: sudo apt install pandoc

    - name: Clone repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT }}

    - name: Build man pages
      run: make man

    - uses: stefanzweifel/git-auto-commit-action@v5
      name: Commit
      with:
        commit_message: "[gha] build man pages"
